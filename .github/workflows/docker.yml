name: Build and push moseq Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/llorente-lab/moseq

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout moseq2-app
        uses: actions/checkout@v4
        with:
          path: moseq2-app

      - name: Clone sibling packages
        run: |
          for repo in pybasicbayes pyhsmm pyhsmm-autoregressive \
                      moseq2-extract moseq2-pca moseq2-model moseq2-viz; do
            git clone --depth 1 \
              https://github.com/llorente-lab/${repo}.git \
              ${repo}
          done

      - name: Assemble build context
        run: |
          mkdir -p /tmp/moseq-ctx
          cp moseq2-app/Dockerfile /tmp/moseq-ctx/
          for repo in pybasicbayes pyhsmm pyhsmm-autoregressive \
                      moseq2-extract moseq2-pca moseq2-model moseq2-viz moseq2-app; do
            cp -r ${repo} /tmp/moseq-ctx/${repo}
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: /tmp/moseq-ctx
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
